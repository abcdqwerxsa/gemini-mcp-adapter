<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCP Adapter</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262a33;--fg:#e6e8ee;--dim:#8b93a7;--acc:#6ea8fe;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:5}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header .url{font-family:var(--mono);color:var(--dim);font-size:12px}
  header .sp{flex:1}
  nav button{background:none;border:0;color:var(--dim);font:inherit;padding:6px 10px;cursor:pointer;border-radius:6px}
  nav button.on{background:var(--line);color:var(--fg)}
  main{max-width:1180px;margin:0 auto;padding:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
  .card .sub{color:var(--dim);font-size:12px;word-break:break-all}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .tag.ok{color:var(--ok);border-color:#14532d}.tag.bad{color:var(--bad);border-color:#7f1d1d}.tag.warn{color:var(--warn);border-color:#78350f}
  button.b{font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:#1f2430;color:var(--fg);cursor:pointer}
  button.b:hover{border-color:var(--acc)}
  button.b.pri{background:var(--acc);border-color:var(--acc);color:#0b1220;font-weight:600}
  button.b.danger{color:var(--bad)}
  button.b.sm{padding:3px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.mono{font-family:var(--mono);font-size:12px}
  .code{font-family:var(--mono);font-size:12px;background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-all}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:min(560px,94vw);padding:0}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog form{padding:18px 20px;display:grid;gap:12px}
  dialog h2{margin:0;font-size:15px}
  label{display:grid;gap:4px;font-size:12px;color:var(--dim)}
  input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:#0b0d12;border:1px solid var(--line);border-radius:7px;padding:7px 9px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  .hint{font-size:12px;color:var(--dim)}
  .foot{display:flex;justify-content:flex-end;gap:8px}
  .flash{position:fixed;bottom:18px;right:18px;background:#0b0d12;border:1px solid var(--line);border-left:3px solid var(--acc);padding:10px 14px;border-radius:8px;font-size:13px;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .flash.bad{border-left-color:var(--bad)}.flash.ok{border-left-color:var(--ok)}
  #login{max-width:360px;margin:16vh auto}
  .tools{font-size:12px;color:var(--dim);max-height:160px;overflow:auto}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;background:#0b0d12;border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin:1px 2px}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>MCP Adapter</h1><span class="url" id="puburl"></span><span class="sp"></span>
  <nav>
    <button data-tab="instances" class="on">Instances</button>
    <button data-tab="clients">Gemini Clients</button>
    <button data-tab="log">Requests</button>
    <button data-tab="howto">接入说明</button>
  </nav>
  <span class="sp"></span><button class="b sm" id="logout">退出</button>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="flash"></div>

<div id="login" class="card hidden">
  <h3>登录面板</h3>
  <form id="loginform" style="display:grid;gap:10px;margin-top:10px">
    <label>密码<input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="b pri" type="submit">登录</button>
    <div class="hint" id="loginhint"></div>
  </form>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const api = async (method, path, body) => {
  const r = await fetch(path, { method, headers: body ? {'content-type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), { status: r.status });
  return j;
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let flashTimer;
const flash = (msg, kind='') => { const f=$('#flash'); f.className='flash '+kind; f.textContent=msg; clearTimeout(flashTimer); flashTimer=setTimeout(()=>f.className='hidden', 5000); };
const copy = async (text) => { try { await navigator.clipboard.writeText(text); flash('已复制','ok'); } catch { flash('复制失败','bad'); } };
const ago = (t) => { const s=Math.round((Date.now()-t)/1000); return s<60?`${s}s 前`:s<3600?`${Math.round(s/60)}m 前`:`${Math.round(s/3600)}h 前`; };

let tab = 'instances', state = { instances: [], clients: [], meta: {} };

// ---------- auth ----------
async function me() { try { return await api('GET','/api/me'); } catch (e) { if (e.status===503) { $('#login').classList.remove('hidden'); $('#loginhint').textContent='面板尚未初始化：设置一个密码（≥8 位）即可。'; $('#loginform button').textContent='设置密码并登录'; $('#login').dataset.setup='1'; } else { $('#login').classList.remove('hidden'); $('#login').dataset.setup=''; } throw e; } }
$('#loginform').onsubmit = async (e) => {
  e.preventDefault(); const pw = $('#pw').value;
  try {
    if ($('#login').dataset.setup) await api('POST','/api/setup',{password:pw});
    await api('POST','/api/login',{password:pw});
    $('#login').classList.add('hidden'); $('#pw').value=''; boot();
  } catch (err) { $('#loginhint').textContent = err.message; }
};
$('#logout').onclick = async () => { await api('POST','/api/logout'); location.reload(); };

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab=b.dataset.tab; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b)); render(); });

async function load() {
  [state.instances, state.clients, state.meta] = await Promise.all([api('GET','/api/instances'), api('GET','/api/clients'), api('GET','/api/meta')]);
  $('#puburl').textContent = state.meta.publicUrl;
}
async function boot() { try { await me(); } catch { return; } await load(); render(); }

function render() {
  const m = $('#main');
  if (tab==='instances') m.innerHTML = instancesView();
  else if (tab==='clients') m.innerHTML = clientsView();
  else if (tab==='log') m.innerHTML = '<div class="card"><h3>最近请求 <span class="tag">最多 100 条</span></h3><div id="logtable" class="hint">加载中…</div></div>', loadLog();
  else if (tab==='howto') m.innerHTML = howtoView();
  bind();
}

// ---------- instances ----------
const probeCache = {};
function instancesView() {
  const cards = state.instances.map(i => `
    <div class="card" data-name="${esc(i.name)}">
      <h3>${i.icon?`<img src="${esc(i.icon)}" alt="" width="22" height="22" style="border-radius:5px;object-fit:contain">`:''}${esc(i.name)} <span class="tag" data-probe>未检测</span> <span class="tag">${esc(i.authType)}</span></h3>
      <div class="sub">${esc(i.url)}</div>
      <div class="sub">strip outputSchema: ${i.stripOutputSchema?'on':'off'}${i.headerKeys?.length?' · headers: '+i.headerKeys.map(esc).join(', '):''}${i.paramKeys?.length?' · params: '+i.paramKeys.map(esc).join(', '):''}</div>
      <div class="tools" data-tools></div>
      <div class="row">
        <button class="b sm" data-act="probe">检测</button>
        <button class="b sm" data-act="edit">编辑</button>
        <button class="b sm" data-act="conn">Gemini 接入信息</button>
        <button class="b sm danger" data-act="del">删除</button>
      </div>
    </div>`).join('');
  return `<div class="row" style="margin:0 0 14px"><button class="b pri" data-act="add">+ 添加 MCP</button><span class="hint">${state.instances.length} 个实例 · 路径 <span class="pill">/mcp/&lt;name&gt;</span></span></div>
    <div class="cards">${cards || '<div class="card sub">还没有实例。添加一个远程 MCP server（Stitch、GitHub、Notion…），adapter 会把它以 OAuth 2.1 的形式暴露给 Gemini。</div>'}</div>`;
}
function connBlock(name) {
  const cl = state.clients[0];
  return `# Gemini → Settings → Connected apps / Developer Mode → Connect to an MCP server
MCP Server URL : ${state.meta.publicUrl}/mcp/${name}
Client ID      : ${cl ? cl.id : '(先在 Gemini Clients 里创建一个)'}
Client secret  : (在 Gemini Clients 页查看/轮换；同意页要再输一次)`;
}
function bind() {
  $('#main').querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const act = b.dataset.act; const card = b.closest('[data-name]'); const name = card?.dataset.name;
    try {
      if (act==='add') openEdit();
      else if (act==='edit') openEdit(state.instances.find(i=>i.name===name));
      else if (act==='del') { if (!confirm(`删除实例 ${name}？Gemini 侧会立刻无法调用。`)) return; await api('DELETE',`/api/instances/${name}`); await load(); render(); flash('已删除'); }
      else if (act==='conn') { const t = connBlock(name); openDlg(`<h2>Gemini 接入信息 · ${esc(name)}</h2><div class="code">${esc(t)}</div><div class="foot"><button class="b" data-close>关闭</button><button class="b pri" data-copy>复制</button></div>`); $('#dlg [data-copy]').onclick=()=>copy(t); }
      else if (act==='probe') {
        const tag = card.querySelector('[data-probe]'); tag.className='tag warn'; tag.textContent='检测中…';
        try { const r = await api('POST',`/api/instances/${name}/probe`); probeCache[name]=r;
          if (r.ok) { tag.className='tag ok'; tag.textContent=`${r.tools.length} 个工具 · ${r.ms} ms`; card.querySelector('[data-tools]').innerHTML = `${r.serverInfo?esc(r.serverInfo.name)+' · ':''}${r.protocolVersion??''}<br>`+r.tools.map(t=>`<span class="pill" title="${esc(t.description??'')}">${esc(t.name)}${t.readOnly?' ⓘ':''}</span>`).join('')+(r.rawListBytes?`<br>tools/list: ${r.rawListBytes} → ${r.listBytes} bytes`:''); }
          else { tag.className='tag bad'; tag.textContent='失败'; card.querySelector('[data-tools]').textContent = r.error||''; }
        } catch (e) { tag.className='tag bad'; tag.textContent='失败'; card.querySelector('[data-tools]').textContent=e.message; }
      }
    } catch (e) { flash(e.message,'bad'); }
  });
}

function openEdit(i) {
  const a = i?.auth ?? { type: 'none' };
  const isOauth = a.type==='oauth2';
  openDlg(`<form method="dialog" id="eform">
    <h2>${i?'编辑':'添加'} MCP 实例</h2>
    <label>名称（小写字母/数字/-，作为 URL 路径）<input name="name" required pattern="[a-z0-9][a-z0-9-]{0,40}" value="${esc(i?.name??'')}" ${i?'readonly':''}></label>
    <label>MCP Server URL（Streamable HTTP）<input name="url" required type="url" placeholder="https://stitch.googleapis.com/mcp" value="${esc(i?.url??'')}"></label>
    <label>上游鉴权
      <select name="authType">
        ${['none','header','query','bearer','oauth2'].map(t=>`<option value="${t}" ${a.type===t?'selected':''}>${{none:'无鉴权',header:'静态 Header（API Key 等）',query:'Query 参数',bearer:'Bearer Token',oauth2:'OAuth2 client_credentials（adapter 自动换 token）'}[t]}</option>`).join('')}
      </select></label>
    <label data-f="header" class="${a.type==='header'?'':'hidden'}">Headers（JSON，会原样加到每个上游请求）<textarea name="headers" rows="3" placeholder='{"X-Goog-Api-Key": "..."}'>${esc(a.type==='header'?JSON.stringify(a.headers,null,2):(i?.headers?JSON.stringify(i.headers,null,2):''))}</textarea></label>
    <label data-f="query" class="${a.type==='query'?'':'hidden'}">Query 参数（JSON）<textarea name="params" rows="2" placeholder='{"api_key": "..."}'>${esc(a.type==='query'?JSON.stringify(a.params,null,2):'')}</textarea></label>
    <label data-f="bearer" class="${a.type==='bearer'?'':'hidden'}">Token（留空则用环境变量）<input name="token" value=""></label>
    <label data-f="bearer" class="${a.type==='bearer'?'':'hidden'}">或 Token 环境变量名<input name="tokenEnv" value="${esc(a.tokenEnv??'')}" placeholder="MY_TOKEN"></label>
    <label data-f="oauth2" class="${isOauth?'':'hidden'}">Token URL<input name="tokenUrl" type="url" value="${esc(a.tokenUrl??'')}"></label>
    <label data-f="oauth2" class="${isOauth?'':'hidden'}">Client ID<input name="clientId" value="${esc(a.clientId??'')}"></label>
    <label data-f="oauth2" class="${isOauth?'':'hidden'}">Client Secret<input name="clientSecret" value=""></label>
    <label data-f="oauth2" class="${isOauth?'':'hidden'}">Scope（可选）<input name="scope" value="${esc(a.scope??'')}"></label>
    <label data-f="oauth2" class="${isOauth?'':'hidden'}">Client 认证方式<select name="clientAuth"><option value="basic" ${a.clientAuth!=='post'?'selected':''}>Basic（默认）</option><option value="post" ${a.clientAuth==='post'?'selected':''}>POST body</option></select></label>
    <label><input type="checkbox" name="strip" ${i?.stripOutputSchema!==false?'checked':''} style="width:auto"> 剥离 outputSchema（强烈建议：Stitch 417 KB → 8 KB，省 token）</label>
    <label>上游超时（ms）<input name="timeoutMs" type="number" min="1000" max="600000" value="${i?.timeoutMs??90000}"></label>
    <label>图标 URL（可选，PNG 512×512；写入 MCP serverInfo.icons，支持的客户端会显示）<input name="icon" type="url" placeholder="https://…/logo-512.png" value="${esc(i?.icon??'')}"></label>
    <div class="foot"><button type="button" class="b" data-close>取消</button><button class="b pri" type="submit">保存</button></div>
  </form>`);
  const f = $('#eform');
  f.authType.onchange = () => f.querySelectorAll('[data-f]').forEach(l => l.classList.toggle('hidden', l.dataset.f!==f.authType.value));
  f.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(f); const t = f.authType.value;
    const body = { name: fd.get('name'), url: fd.get('url'), stripOutputSchema: fd.get('strip')==='on', timeoutMs: Number(fd.get('timeoutMs'))||90000 };
    if (fd.get('icon')) body.icon = fd.get('icon');
    if (t==='header') { try { body.auth={type:'header',headers:JSON.parse(fd.get('headers')||'{}')}; } catch { return flash('Headers 不是合法 JSON','bad'); } }
    else if (t==='query') { try { body.auth={type:'query',params:JSON.parse(fd.get('params')||'{}')}; } catch { return flash('Params 不是合法 JSON','bad'); } }
    else if (t==='bearer') { body.auth={type:'bearer'}; if (fd.get('token')) body.auth.token=fd.get('token'); if (fd.get('tokenEnv')) body.auth.tokenEnv=fd.get('tokenEnv'); }
    else if (t==='oauth2') { body.auth={type:'oauth2',tokenUrl:fd.get('tokenUrl'),clientId:fd.get('clientId'),clientAuth:fd.get('clientAuth')}; if (fd.get('clientSecret')) body.auth.clientSecret=fd.get('clientSecret'); if (fd.get('scope')) body.auth.scope=fd.get('scope'); }
    else body.auth={type:'none'};
    try {
      if (i) await api('PUT',`/api/instances/${i.name}`,body); else await api('POST','/api/instances',body);
      $('#dlg').close(); await load(); render(); flash('已保存，立即生效','ok');
    } catch (e) { flash(e.message,'bad'); }
  };
}

// ---------- clients ----------
function clientsView() {
  const rows = state.clients.map(c => `<tr><td class="mono">${esc(c.id)}</td><td>${esc(c.name??'')}</td><td class="mono">${esc((c.redirectUris??[]).join(', ')||'(默认 Google 回调白名单)')}</td>
    <td style="white-space:nowrap"><button class="b sm" data-act="rot" data-id="${esc(c.id)}">轮换 secret</button> <button class="b sm danger" data-act="delc" data-id="${esc(c.id)}">删除</button></td></tr>`).join('');
  return `<div class="card"><h3>Gemini 客户端凭据 <span class="tag">${state.clients.length}</span></h3>
    <div class="hint">每个 Gemini 账号/环境一个 client。同意页会要求输入该 client 的 secret。secret 只在创建/轮换时显示一次。</div>
    <table><tr><th>Client ID</th><th>名称</th><th>redirect_uri</th><th></th></tr>${rows}</table>
    <div class="row"><input id="cid" placeholder="client id，如 gemini" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{0,40}"> <input id="cname" placeholder="备注（可选）"> <button class="b pri" data-act="addc">+ 创建</button></div></div>`;
}
function bindClients(root) {
  root.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const id=b.dataset.id;
    try {
      if (b.dataset.act==='addc') { const r=await api('POST','/api/clients',{id:$('#cid').value.trim(),name:$('#cname').value.trim()}); await load(); render(); openDlg(`<h2>已创建 · ${esc(r.id)}</h2><div class="hint">secret 只显示这一次，请立即复制：</div><div class="code" id="sec">${esc(r.secret)}</div><div class="foot"><button class="b" data-close>关闭</button><button class="b pri" data-copy>复制</button></div>`); $('#dlg [data-copy]').onclick=()=>copy(r.secret); }
      else if (b.dataset.act==='rot') { if(!confirm(`轮换 ${id} 的 secret？旧 secret 立刻失效，所有已签发的 token 也会失效。`)) return; const r=await api('POST',`/api/clients/${id}/rotate`); openDlg(`<h2>新 secret · ${esc(id)}</h2><div class="code" id="sec">${esc(r.secret)}</div><div class="foot"><button class="b" data-close>关闭</button><button class="b pri" data-copy>复制</button></div>`); $('#dlg [data-copy]').onclick=()=>copy(r.secret); }
      else if (b.dataset.act==='delc') { if(!confirm(`删除 client ${id}？`)) return; await api('DELETE',`/api/clients/${id}`); await load(); render(); flash('已删除'); }
    } catch (e) { flash(e.message,'bad'); }
  });
}

// ---------- log ----------
async function loadLog() {
  try {
    const rows = await api('GET','/api/log');
    $('#logtable').innerHTML = rows.length ? `<table><tr><th>时间</th><th>实例</th><th>方法</th><th>状态</th><th>耗时</th><th>client</th><th>错误</th></tr>` +
      rows.map(r=>`<tr><td class="mono">${ago(r.t)}</td><td class="mono">${esc(r.inst)}</td><td class="mono">${esc(r.method)}</td><td><span class="tag ${r.status<300?'ok':r.status<500?'warn':'bad'}">${r.status}</span></td><td class="mono">${r.ms} ms</td><td class="mono">${esc(r.client??'-')}</td><td class="sub">${esc(r.err??'')}</td></tr>`).join('') + '</table>' : '<div class="hint">还没有请求。</div>';
  } catch (e) { $('#logtable').textContent = e.message; }
}

// ---------- howto ----------
function howtoView() {
  return `<div class="card"><h3>接入说明</h3>
  <ol class="hint" style="padding-left:18px;line-height:1.8">
    <li>在 <b>Instances</b> 添加上游 MCP（填 URL + 它需要的鉴权），点“检测”确认能通。</li>
    <li>在 <b>Gemini Clients</b> 创建一个 client，复制 secret。</li>
    <li>Gemini → 设置 → Connected apps（或 <span class="pill">gemini.google.com/devmode</span>）→ Connect to an MCP server，按实例卡片上的“Gemini 接入信息”填写。</li>
    <li>浏览器会弹 adapter 的同意页，输入同一个 secret，授权完成。</li>
  </ol>
  <div class="hint" style="margin-top:8px">支持的 upstream 鉴权：无 / 静态 Header / Query / Bearer / OAuth2 client_credentials。上游需要“每个用户各自登录”的（如 Notion、GitHub 用户授权）目前不支持——adapter 上所有 Gemini 用户共用配置里那一套凭据。</div></div>`;
}

// ---------- dialog ----------
function openDlg(html) { const d=$('#dlg'); d.innerHTML=html; d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close()); d.showModal(); }

// patch: bind() must also bind client actions when on that tab
const _bind = bind;
bind = function() { _bind(); if (tab==='clients') bindClients($('#main')); };

boot();
</script>
</body>
</html>

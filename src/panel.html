<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MCP Adapter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b4a8f'/%3E%3Cg fill='%23d3e3fd'%3E%3Ccircle cx='32' cy='18' r='7'/%3E%3Ccircle cx='16' cy='46' r='7'/%3E%3Ccircle cx='48' cy='46' r='7'/%3E%3C/g%3E%3Cg stroke='%23d3e3fd' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M32 25v8M28 36l-9 5M36 36l9 5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&family=Noto+Sans+SC:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap" rel="stylesheet">
<style>
  /* Material 3 tokens — blue seed, light + dark via light-dark().
     Raw values are kept separately so they can be recombined; the semantic
     tokens switch with color-scheme (system preference, or the toggle below). */
  :root{
    color-scheme:light dark;
    --p-l:#0b57d0; --p-d:#a8c7fa;          --on-p-l:#ffffff; --on-p-d:#062e6f;
    --pc-l:#d3e3fd; --pc-d:#0b4a8f;        --on-pc-l:#041e49; --on-pc-d:#d3e3fd;
    --s-l:#565e71; --s-d:#bec6dc;          --on-s-l:#ffffff; --on-s-d:#1d2a41;
    --sc-l:#dae2f9; --sc-d:#344057;        --on-sc-l:#191c20; --on-sc-d:#dae2f9;
    --surf-l:#f9f9ff; --surf-d:#0f1115;    --surf-cl-l:#f2f3fa; --surf-cl-d:#15181d;
    --surf-c-l:#eaeef4; --surf-c-d:#191c21; --surf-ch-l:#e4e7ec; --surf-ch-d:#23262c;
    --surf-chh-l:#dee3ea; --surf-chh-d:#2e3138; --surf-cl-lowest-l:#ffffff; --surf-cl-lowest-d:#0a0c0f;
    --on-surf-l:#191c20; --on-surf-d:#e2e2e9; --on-surf-v-l:#44474e; --on-surf-v-d:#c3c6cf;
    --outline-l:#74777f; --outline-d:#74777f; --outline-v-l:#c4c6d0; --outline-v-d:#44474e;
    --ok-l:#146c2e; --ok-d:#7fdba0;        --okc-l:#c4eed0; --okc-d:#1b4d2c;
    --bad-l:#ba1a1a; --bad-d:#ffb4ab;      --badc-l:#ffdad6; --badc-d:#93000a;
    --warn-l:#7a5900; --warn-d:#f5d47a;    --warnc-l:#ffdf9e; --warnc-d:#5a4200;
    --toast-l:#313033; --toast-d:#e2e2e9;  --on-toast-l:#ffffff; --on-toast-d:#1f1f1f;

    --primary:light-dark(var(--p-l),var(--p-d)); --on-primary:light-dark(var(--on-p-l),var(--on-p-d));
    --primary-container:light-dark(var(--pc-l),var(--pc-d)); --on-primary-container:light-dark(var(--on-pc-l),var(--on-pc-d));
    --secondary:light-dark(var(--s-l),var(--s-d)); --on-secondary:light-dark(var(--on-s-l),var(--on-s-d));
    --secondary-container:light-dark(var(--sc-l),var(--sc-d)); --on-secondary-container:light-dark(var(--on-sc-l),var(--on-sc-d));
    --surface:light-dark(var(--surf-l),var(--surf-d)); --surface-container-lowest:light-dark(var(--surf-cl-lowest-l),var(--surf-cl-lowest-d));
    --surface-container-low:light-dark(var(--surf-cl-l),var(--surf-cl-d)); --surface-container:light-dark(var(--surf-c-l),var(--surf-c-d));
    --surface-container-high:light-dark(var(--surf-ch-l),var(--surf-ch-d)); --surface-container-highest:light-dark(var(--surf-chh-l),var(--surf-chh-d));
    --on-surface:light-dark(var(--on-surf-l),var(--on-surf-d)); --on-surface-variant:light-dark(var(--on-surf-v-l),var(--on-surf-v-d));
    --outline:light-dark(var(--outline-l),var(--outline-d)); --outline-variant:light-dark(var(--outline-v-l),var(--outline-v-d));
    --success:light-dark(var(--ok-l),var(--ok-d)); --success-container:light-dark(var(--okc-l),var(--okc-d));
    --error:light-dark(var(--bad-l),var(--bad-d)); --error-container:light-dark(var(--badc-l),var(--badc-d));
    --warning:light-dark(var(--warn-l),var(--warn-d)); --warning-container:light-dark(var(--warnc-l),var(--warnc-d));
    --toast-bg:light-dark(var(--toast-l),var(--toast-d)); --on-toast:light-dark(var(--on-toast-l),var(--on-toast-d));
    --hover:light-dark(rgba(0,0,0,.06),rgba(255,255,255,.05));
    --primary-hover:light-dark(rgba(11,87,208,.08),rgba(168,199,250,.08));
    --danger-hover:light-dark(rgba(186,26,26,.08),rgba(255,180,171,.08));
    --radius-xs:4px; --radius-s:8px; --radius-m:12px; --radius-l:16px; --radius-xl:28px;
    --elev-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15); --elev-2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15); --elev-3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3);
  }
  /* Manual override (toggle in the rail): pinned to one scheme regardless of OS */
  html[data-scheme="light"]{color-scheme:light}
  html[data-scheme="dark"]{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--surface);color:var(--on-surface);font:14px/1.5 "Roboto Flex","Noto Sans SC",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;vertical-align:middle}
  .ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
  .mono{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12.5px}

  /* shell */
  .shell{display:grid;grid-template-columns:88px 1fr;height:100vh}
  .rail{background:var(--surface-container-low);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;border-right:1px solid var(--outline-variant)}
  .rail .brand{width:48px;height:48px;border-radius:var(--radius-m);background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;margin-bottom:16px}
  .rail .brand .ms{font-size:26px}
  .rail a{width:80px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:var(--radius-l);color:var(--on-surface-variant);text-decoration:none;font-size:12px;font-weight:500;cursor:pointer}
  .rail a:hover{background:var(--hover)}
  .rail a.on{background:var(--secondary-container);color:var(--on-secondary-container)}
  .rail a.on .ms{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
  .rail .sp{flex:1}
  .main{display:flex;flex-direction:column;min-width:0}
  .appbar{display:flex;align-items:center;gap:12px;padding:12px 24px;min-height:64px}
  .appbar h1{font-size:22px;font-weight:500;margin:0;letter-spacing:0}
  .appbar .sub{color:var(--on-surface-variant);font-size:13px;margin-top:2px}
  .appbar .sp{flex:1}
  .content{padding:8px 24px 32px;overflow:auto;flex:1}

  /* components */
  .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 24px;border-radius:20px;border:0;cursor:pointer;font:500 14px "Roboto Flex","Noto Sans SC",system-ui,sans-serif;transition:background .15s,box-shadow .15s;white-space:nowrap}
  .btn .ms{font-size:18px}
  .btn.filled{background:var(--primary);color:var(--on-primary)}
  .btn.filled:hover{box-shadow:var(--elev-1)}
  .btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
  .btn.tonal:hover{box-shadow:var(--elev-1)}
  .btn.outlined{background:transparent;color:var(--primary);border:1px solid var(--outline)}
  .btn.outlined:hover{background:var(--primary-hover)}
  .btn.text{background:transparent;color:var(--primary);padding:0 16px;height:36px}
  .btn.text:hover{background:var(--primary-hover)}
  .btn.text.danger{color:var(--error)}
  .btn.text.danger:hover{background:var(--danger-hover)}
  .btn.sm{height:32px;padding:0 14px;font-size:13px;border-radius:16px}
  .btn.sm .ms{font-size:16px}
  .btn:disabled{opacity:.5;cursor:default}
  .iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--on-surface-variant);display:grid;place-items:center;cursor:pointer}
  .iconbtn:hover{background:var(--hover)}

  .card{background:var(--surface-container-low);border-radius:var(--radius-l);padding:20px 22px}
  .card.elev{background:var(--surface-container-high);box-shadow:var(--elev-1)}
  .card h3{margin:0 0 4px;font-size:16px;font-weight:500;display:flex;align-items:center;gap:10px}
  .card .desc{color:var(--on-surface-variant);font-size:13px;margin:0}
  .card h3 .ms{color:var(--primary)}

  .chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;font-size:12.5px;font-weight:500;background:var(--surface-container-high);color:var(--on-surface-variant);border:1px solid transparent}
  .chip .ms{font-size:16px}
  .chip.ok{background:var(--success-container);color:var(--success)}
  .chip.bad{background:var(--error-container);color:var(--error)}
  .chip.warn{background:var(--warning-container);color:var(--warning)}
  .chip.primary{background:var(--primary-container);color:var(--on-primary-container)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:12.5px;font-weight:500;color:var(--on-surface-variant);padding:12px 14px;border-bottom:1px solid var(--outline-variant)}
  td{padding:14px;border-bottom:1px solid var(--outline-variant);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--hover)}

  .code{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12.5px;background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--radius-m);padding:14px 16px;white-space:pre-wrap;word-break:break-all;line-height:1.65;color:var(--on-surface)}
  .code .k{color:var(--on-surface-variant)}
  .code .v{color:var(--primary)}

  dialog{background:var(--surface-container-high);color:var(--on-surface);border:0;border-radius:var(--radius-xl);width:min(600px,94vw);padding:0;box-shadow:var(--elev-3);max-height:92vh}
  dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
  dialog .dh{padding:24px 24px 8px}
  dialog .dh h2{margin:0;font-size:24px;font-weight:400}
  dialog .dh p{margin:6px 0 0;color:var(--on-surface-variant);font-size:14px}
  dialog form{padding:12px 24px 8px;display:grid;gap:16px;overflow:auto;max-height:62vh}
  dialog .df{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 24px}

  .field{display:grid;gap:6px}
  .field label{font-size:12.5px;font-weight:500;color:var(--on-surface-variant)}
  .field input,.field select,.field textarea{font:14px "Roboto Flex","Noto Sans SC",system-ui,sans-serif;color:var(--on-surface);background:var(--surface-container-lowest);border:1px solid var(--outline);border-radius:var(--radius-xs);padding:12px 14px;outline:none;transition:border-color .15s}
  .field textarea{font-family:"Roboto Mono",monospace;font-size:13px;line-height:1.5;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);border-width:2px;padding:11px 13px}
  .field .hint{font-size:12px;color:var(--on-surface-variant)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .switch{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
  .switch input{appearance:none;width:52px;height:32px;border-radius:16px;background:var(--surface-container-highest);position:relative;cursor:pointer;transition:background .2s;margin:0;flex-shrink:0}
  .switch input::after{content:"";position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .2s}
  .switch input:checked{background:var(--primary)}
  .switch input:checked::after{left:28px;width:24px;height:24px;top:4px;background:var(--on-primary)}
  .switch .t{display:grid}
  .switch .t b{font-weight:500;font-size:14px}
  .switch .t span{font-size:12.5px;color:var(--on-surface-variant)}

  .secret{display:flex;align-items:center;gap:8px;background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--radius-m);padding:12px 14px}
  .secret .mono{flex:1;word-break:break-all;color:var(--primary)}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--on-toast);padding:12px 18px;border-radius:8px;font-size:14px;box-shadow:var(--elev-3);opacity:0;pointer-events:none;transition:all .2s;z-index:20;display:flex;align-items:center;gap:10px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .ms{font-size:18px;color:var(--on-toast)}
  .toast.bad .ms{color:var(--error)}

  /* instances grid */
  .inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  .inst{display:flex;flex-direction:column;gap:14px}
  .inst .head{display:flex;align-items:flex-start;gap:12px}
  .inst .avatar{width:44px;height:44px;border-radius:var(--radius-m);background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
  .inst .avatar img{width:100%;height:100%;object-fit:contain}
  .inst .avatar .ms{font-size:24px}
  .inst .head .t{flex:1;min-width:0}
  .inst .head h3{margin:0;font-size:16px;font-weight:500;display:block}
  .inst .head .url{color:var(--on-surface-variant);font-size:12.5px;font-family:"Roboto Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .inst .chips{display:flex;gap:6px;flex-wrap:wrap}
  .inst .tools{display:flex;flex-wrap:wrap;gap:4px;max-height:76px;overflow:auto;font-size:11.5px;color:var(--on-surface-variant)}
  .inst .tools span{background:var(--surface-container);border-radius:6px;padding:2px 7px;font-family:"Roboto Mono",monospace}
  .inst .meta{font-size:12.5px;color:var(--on-surface-variant);display:flex;gap:14px;flex-wrap:wrap}
  .inst .actions{display:flex;gap:6px;margin-top:auto;padding-top:8px;align-items:center}.inst .actions .sp{flex:1}.inst .actions .iconbtn{width:36px;height:36px}
  .inst .err{font-size:12.5px;color:var(--error);background:var(--error-container);border-radius:var(--radius-s);padding:8px 12px;word-break:break-all}

  .empty{display:grid;place-items:center;padding:64px 24px;text-align:center;color:var(--on-surface-variant)}
  .empty .ms{font-size:56px;color:var(--outline);margin-bottom:12px}
  .empty h3{color:var(--on-surface);font-weight:500;font-size:18px;margin:0 0 6px}
  .empty p{margin:0 0 20px;font-size:14px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--surface-container-low);border-radius:var(--radius-m);padding:16px 18px}
  .stat .n{font-size:28px;font-weight:500;line-height:1.1}
  .stat .l{font-size:12.5px;color:var(--on-surface-variant);margin-top:4px;display:flex;align-items:center;gap:6px}
  .stat .l .ms{font-size:16px}

  .log-table td.mono{font-size:12px}
  .log-table .err-cell{color:var(--error);font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* login */
  #login{position:fixed;inset:0;display:grid;place-items:center;background:var(--surface);z-index:30}
  #login .box{width:min(400px,92vw)}
  #login .hero{display:grid;place-items:center;margin-bottom:24px}
  #login .hero .logo{width:72px;height:72px;border-radius:20px;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;box-shadow:var(--elev-2)}
  #login .hero .logo .ms{font-size:40px}
  #login h2{text-align:center;font-size:26px;font-weight:400;margin:0}
  #login p{text-align:center;color:var(--on-surface-variant);margin:6px 0 0 0;font-size:14px}
  #login form{display:grid;gap:14px;margin-top:24px}
  .hidden{display:none!important}

  @media (max-width:720px){.shell{grid-template-columns:1fr}.rail{flex-direction:row;padding:8px;border-right:0;border-bottom:1px solid var(--outline-variant);overflow:auto}.rail .brand{margin:0 8px 0 0;width:40px;height:40px}.rail .sp{display:none}.rail a{width:64px;padding:8px 0}.grid2{grid-template-columns:1fr}.content{padding:8px 14px 32px}.appbar{padding:8px 14px;flex-wrap:wrap}}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="box">
    <div class="hero"><div class="logo"><span class="ms fill">hub</span></div></div>
    <h2>MCP Adapter</h2>
    <p id="loginhint">登录管理面板</p>
    <form id="loginform">
      <div class="field"><label>密码</label><input type="password" id="pw" autocomplete="current-password" required autofocus></div>
      <button class="btn filled" type="submit" style="width:100%;justify-content:center;height:44px" id="loginbtn">登录</button>
    </form>
  </div>
</div>

<div class="shell">
  <nav class="rail">
    <div class="brand" title="MCP Adapter"><span class="ms fill">hub</span></div>
    <a data-tab="instances" class="on"><span class="ms">dns</span>实例</a>
    <a data-tab="clients"><span class="ms">key</span>客户端</a>
    <a data-tab="log"><span class="ms">monitoring</span>请求</a>
    <a data-tab="guide"><span class="ms">help</span>接入</a>
    <span class="sp"></span>
    <button class="iconbtn" id="themebtn" title="切换主题" aria-label="切换主题"><span class="ms" id="themeicon">dark_mode</span></button>
    <button class="iconbtn" id="logout" title="退出"><span class="ms">logout</span></button>
  </nav>
  <div class="main">
    <header class="appbar">
      <div><h1 id="title">实例</h1><div class="sub" id="subtitle"></div></div>
      <span class="sp"></span>
      <span class="chip primary" id="pubchip"><span class="ms" style="font-size:16px">public</span><span id="puburl"></span></span>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast"><span class="ms">check_circle</span><span id="toastmsg"></span></div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const api=async(m,p,b)=>{const r=await fetch(p,{method:m,headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||r.statusText),{status:r.status});return j};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{const s=Math.round((Date.now()-t)/1000);return s<60?`${s} 秒前`:s<3600?`${Math.round(s/60)} 分钟前`:`${Math.round(s/3600)} 小时前`};
const fmtB=n=>n==null?'—':n>1024?`${(n/1024).toFixed(0)} KB`:`${n} B`;
let toastT;const toast=(m,bad=false)=>{const t=$('#toast');t.className='toast show'+(bad?' bad':'');t.querySelector('.ms').textContent=bad?'error':'check_circle';$('#toastmsg').textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',3500)};
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast('已复制到剪贴板')}catch{toast('复制失败',true)}};
const AUTH_LABEL={none:'无鉴权',header:'Header',query:'Query',bearer:'Bearer',oauth2:'OAuth2'};
const AUTH_ICON={none:'lock_open',header:'key',query:'link',bearer:'token',oauth2:'verified_user'};

let tab='instances', S={instances:[],clients:[],meta:{}}, probes={};

async function me(){try{return await api('GET','/api/me')}catch(e){$('#login').classList.remove('hidden');$('#loginbtn').textContent=e.status===503?'设置密码并登录':'登录';$('#loginhint').textContent=e.status===503?'首次使用：设置一个至少 8 位的密码':'登录管理面板';$('#login').dataset.setup=e.status===503?'1':'';throw e}}
$('#loginform').onsubmit=async e=>{e.preventDefault();const pw=$('#pw').value;try{if($('#login').dataset.setup)await api('POST','/api/setup',{password:pw});await api('POST','/api/login',{password:pw});$('#login').classList.add('hidden');$('#pw').value='';boot()}catch(err){toast(err.message,true)}};
$('#logout').onclick=async()=>{await api('POST','/api/logout');location.reload()};

async function load(){[S.instances,S.clients,S.meta]=await Promise.all([api('GET','/api/instances'),api('GET','/api/clients'),api('GET','/api/meta')]);$('#puburl').textContent=S.meta.publicUrl.replace(/^https?:\/\//,'')}
async function boot(){try{await me()}catch{return}await load();render()}

document.querySelectorAll('.rail a').forEach(a=>a.onclick=()=>{tab=a.dataset.tab;document.querySelectorAll('.rail a').forEach(x=>x.classList.toggle('on',x===a));render()});

function setTitle(t,s){$('#title').textContent=t;$('#subtitle').textContent=s||''}
function render(){
  const c=$('#content');
  if(tab==='instances')c.innerHTML=vInstances();
  else if(tab==='clients')c.innerHTML=vClients();
  else if(tab==='log'){c.innerHTML=vLog();loadLog()}
  else if(tab==='guide')c.innerHTML=vGuide();
  bind();
}

/* ---------- instances ---------- */
function vInstances(){
  setTitle('实例',`${S.instances.length} 个上游 MCP · 每个实例暴露在 /mcp/<name>`);
  if(!S.instances.length)return `<div class="card"><div class="empty"><span class="ms">add_circle</span><h3>添加第一个 MCP</h3><p>填入任意远程 MCP server 的 URL 和它的鉴权方式，adapter 会以标准 OAuth 2.1 暴露给 Gemini。</p><button class="btn filled" data-act="add"><span class="ms">add</span>添加 MCP</button></div></div>`;
  return `<div class="inst-grid">${S.instances.map(vInst).join('')}<div class="card" style="display:grid;place-items:center;min-height:220px;border:1px dashed var(--outline-variant);background:transparent"><div style="text-align:center"><button class="btn filled" data-act="add"><span class="ms">add</span>添加 MCP</button><div class="hint" style="color:var(--on-surface-variant);font-size:12.5px;margin-top:10px">任意远程 MCP server</div></div></div></div>`;
}
function vInst(i){
  const p=probes[i.name];
  const status=!p?'<span class="chip">未检测</span>':p.ok?`<span class="chip ok"><span class="ms" style="font-size:16px">check_circle</span>${p.tools.length} 工具 · ${p.ms} ms</span>`:`<span class="chip bad"><span class="ms" style="font-size:16px">error</span>失败</span>`;
  return `<div class="card elev inst" data-name="${esc(i.name)}">
    <div class="head">
      <div class="avatar">${i.icon?`<img src="${esc(i.icon)}" alt="">`:`<span class="ms">${AUTH_ICON[i.authType]||'dns'}</span>`}</div>
      <div class="t"><h3>${esc(i.name)}</h3><div class="url" title="${esc(i.url)}">${esc(i.url)}</div></div>
    </div>
    <div class="chips"><span class="chip"><span class="ms" style="font-size:16px">${AUTH_ICON[i.authType]||'dns'}</span>${AUTH_LABEL[i.authType]||i.authType}</span>${status}${i.stripOutputSchema?'<span class="chip">已剥离 outputSchema</span>':''}</div>
    ${p&&!p.ok?`<div class="err">${esc(p.error||'检测失败')}</div>`:''}
    <div class="tools" data-tools>${p&&p.ok?p.tools.map(t=>`<span title="${esc(t.description??'')}">${esc(t.name)}</span>`).join(''):''}</div>
    ${p&&p.ok&&p.rawListBytes?`<div class="meta"><span>tools/list ${fmtB(p.rawListBytes)} → <b style="color:var(--success)">${fmtB(p.listBytes)}</b></span>${p.protocolVersion?`<span>${esc(p.protocolVersion)}</span>`:''}</div>`:''}
    <div class="actions">
      <button class="btn tonal sm" data-act="probe"><span class="ms">network_check</span>检测</button>
      <button class="btn outlined sm" data-act="conn"><span class="ms">smart_display</span>接入 Gemini</button>
      <span class="sp"></span>
      <button class="iconbtn" data-act="edit" title="编辑"><span class="ms">edit</span></button>
      <button class="iconbtn" data-act="del" title="删除" style="color:var(--error)"><span class="ms">delete</span></button>
    </div>
  </div>`;
}
function connBlock(n){const c=S.clients[0];const u=S.meta.publicUrl;return `MCP Server URL : ${u}/mcp/${n}\nClient ID      : ${c?c.id:'(先创建一个客户端)'}\nClient secret  : ${c?(S.secrets&&S.secrets[c.id]?'********（见下方）':'(仅创建/轮换时显示)'):'—'}`}
function openConn(n){
  const c=S.clients[0];const u=S.meta.publicUrl;
  openDlg(`<div class="dh"><h2>接入 Gemini</h2><p>实例 <b>${esc(n)}</b> · Gemini → 设置 → Connected apps / Developer Mode → Connect to an MCP server</p></div>
  <form method="dialog" style="display:grid;gap:12px">
    <div class="field"><label>MCP Server URL</label><div class="secret"><span class="mono">${u}/mcp/${esc(n)}</span><button type="button" class="iconbtn" data-copy="${u}/mcp/${esc(n)}"><span class="ms">content_copy</span></button></div></div>
    <div class="grid2">
      <div class="field"><label>Client ID</label><div class="secret"><span class="mono">${c?esc(c.id):'—'}</span>${c?`<button type="button" class="iconbtn" data-copy="${esc(c.id)}"><span class="ms">content_copy</span></button>`:''}</div></div>
      <div class="field"><label>Client secret</label><div class="secret"><span class="mono" id="secv" style="color:var(--on-surface-variant)">${c?'••••••••（同意页需再输入一次）':'—'}</span>${c?`<button type="button" class="btn text sm" id="secbtn">显示</button>`:''}</div></div>
    </div>
    <div class="field"><label>说明</label><div class="hint" style="line-height:1.7">· Copy redirect URI 不用配置，Google 的回调地址已在白名单<br>· 浏览器会弹出同意页，输入上面的 Client secret 完成授权<br>· access token 1 小时过期，Gemini 会用 refresh token 自动续期（30 天）</div></div>
  </form><div class="df"><button class="btn text" data-close>关闭</button></div>`);
  if(c){$('#secbtn').onclick=async()=>{try{const r=await api('GET',`/api/clients/${c.id}/secret`);$('#secv').textContent=r.secret;$('#secv').style.color='var(--primary)';const b=$('#secbtn');b.textContent='复制';b.onclick=()=>copy(r.secret)}catch(e){toast(e.message,true)}}}
}

function openEdit(i){
  const a=i?.auth??{type:'none'};const t=a.type;
  openDlg(`<div class="dh"><h2>${i?'编辑实例':'添加 MCP'}</h2><p>${i?'修改会立即生效，不需要重启':'填入远程 MCP server 的 Streamable HTTP 地址'}</p></div>
  <form id="eform">
    <div class="grid2">
      <div class="field"><label>名称</label><input name="name" required pattern="[a-z0-9][a-z0-9-]{0,40}" value="${esc(i?.name??'')}" ${i?'readonly':''} placeholder="stitch"><div class="hint">小写字母、数字、连字符；作为 URL 路径</div></div>
      <div class="field"><label>图标 URL（可选）</label><input name="icon" type="url" value="${esc(i?.icon??'')}" placeholder="https://…/logo-512.png"></div>
    </div>
    <div class="field"><label>MCP Server URL</label><input name="url" required type="url" value="${esc(i?.url??'')}" placeholder="https://stitch.googleapis.com/mcp"></div>
    <div class="field"><label>上游鉴权</label><select name="authType">${['none','header','query','bearer','oauth2'].map(x=>`<option value="${x}" ${t===x?'selected':''}>${AUTH_LABEL[x]}${x==='header'?'（API Key 等）':x==='oauth2'?' client_credentials（自动换 token）':''}</option>`).join('')}</select></div>
    <div class="field" data-f="header"><label>Headers（JSON）</label><textarea name="headers" rows="3" placeholder='{"X-Goog-Api-Key": "..."}'>${esc(t==='header'?JSON.stringify(a.headers,null,2):'')}</textarea><div class="hint">原样加到每个发往上游的请求</div></div>
    <div class="field" data-f="query"><label>Query 参数（JSON）</label><textarea name="params" rows="2" placeholder='{"api_key": "..."}'>${esc(t==='query'?JSON.stringify(a.params,null,2):'')}</textarea></div>
    <div class="grid2" data-f="bearer">
      <div class="field"><label>Token（留空用环境变量）</label><input name="token" value="" autocomplete="off"></div>
      <div class="field"><label>或环境变量名</label><input name="tokenEnv" value="${esc(a.tokenEnv??'')}" placeholder="MY_TOKEN"></div>
    </div>
    <div class="field" data-f="oauth2"><label>Token URL</label><input name="tokenUrl" type="url" value="${esc(a.tokenUrl??'')}" placeholder="https://auth.example.com/oauth/token"></div>
    <div class="grid2" data-f="oauth2">
      <div class="field"><label>Client ID</label><input name="clientId" value="${esc(a.clientId??'')}"></div>
      <div class="field"><label>Client Secret（留空保留原值）</label><input name="clientSecret" value="" autocomplete="off"></div>
    </div>
    <div class="grid2" data-f="oauth2">
      <div class="field"><label>Scope（可选）</label><input name="scope" value="${esc(a.scope??'')}"></div>
      <div class="field"><label>Client 认证</label><select name="clientAuth"><option value="basic" ${a.clientAuth!=='post'?'selected':''}>HTTP Basic</option><option value="post" ${a.clientAuth==='post'?'selected':''}>POST body</option></select></div>
    </div>
    <label class="switch"><input type="checkbox" name="strip" ${i?.stripOutputSchema!==false?'checked':''}><span class="t"><b>剥离 outputSchema</b><span>tools/list 只保留调用所需的 inputSchema，大幅减少上下文占用</span></span></label>
    <div class="field"><label>上游超时（毫秒）</label><input name="timeoutMs" type="number" min="1000" max="600000" value="${i?.timeoutMs??90000}"></div>
  </form><div class="df"><button class="btn text" data-close>取消</button><button class="btn filled" type="submit" form="eform">保存</button></div>`);
  const f=$('#eform');const show=()=>f.querySelectorAll('[data-f]').forEach(l=>l.classList.toggle('hidden',l.dataset.f!==f.authType.value));f.authType.onchange=show;show();
  f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f);const ty=f.authType.value;const b={name:d.get('name'),url:d.get('url'),stripOutputSchema:d.get('strip')==='on',timeoutMs:Number(d.get('timeoutMs'))||90000};if(d.get('icon'))b.icon=d.get('icon');
    try{
      if(ty==='header')b.auth={type:'header',headers:JSON.parse(d.get('headers')||'{}')};
      else if(ty==='query')b.auth={type:'query',params:JSON.parse(d.get('params')||'{}')};
      else if(ty==='bearer'){b.auth={type:'bearer'};if(d.get('token'))b.auth.token=d.get('token');if(d.get('tokenEnv'))b.auth.tokenEnv=d.get('tokenEnv')}
      else if(ty==='oauth2'){b.auth={type:'oauth2',tokenUrl:d.get('tokenUrl'),clientId:d.get('clientId'),clientAuth:d.get('clientAuth')};if(d.get('clientSecret'))b.auth.clientSecret=d.get('clientSecret');else if(i?.auth?.clientSecret)b.auth.clientSecret=i.auth.clientSecret;if(d.get('scope'))b.auth.scope=d.get('scope')}
      else b.auth={type:'none'};
      if(i)await api('PUT',`/api/instances/${i.name}`,b);else await api('POST','/api/instances',b);
      $('#dlg').close();await load();render();toast('已保存，立即生效');
    }catch(err){toast(err.message,true)}};
}

/* ---------- clients ---------- */
function vClients(){setTitle('客户端',`${S.clients.length} 个 Gemini 客户端凭据`);const rows=S.clients.map(c=>`<tr><td class="mono">${esc(c.id)}</td><td>${esc(c.name??'')}</td><td class="mono" style="color:var(--on-surface-variant);font-size:12px">${esc((c.redirectUris??[]).join(', ')||'Google 默认白名单')}</td><td style="white-space:nowrap;text-align:right"><button class="btn text sm" data-act="rot" data-id="${esc(c.id)}"><span class="ms">autorenew</span>轮换</button><button class="btn text sm danger" data-act="delc" data-id="${esc(c.id)}"><span class="ms">delete</span></button></td></tr>`).join('');
  return `<div class="card" style="padding:0;overflow:hidden"><div style="padding:20px 22px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><h3><span class="ms">key</span>Gemini 客户端</h3><p class="desc">每个 Gemini 账号或环境一个 client。secret 只在创建和轮换时显示一次。</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="cid" class="mono" placeholder="client-id，如 gemini" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{0,40}" style="background:var(--surface-container-lowest);border:1px solid var(--outline);border-radius:var(--radius-xs);padding:10px 12px;color:var(--on-surface);width:170px"><input id="cname" placeholder="备注（可选）" style="background:var(--surface-container-lowest);border:1px solid var(--outline);border-radius:var(--radius-xs);padding:10px 12px;color:var(--on-surface);width:150px"><button class="btn filled" data-act="addc"><span class="ms">add</span>创建</button></div></div>
  <table style="margin-top:8px"><thead><tr><th>Client ID</th><th>名称</th><th>redirect_uri</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="color:var(--on-surface-variant);text-align:center;padding:32px">还没有客户端</td></tr>'}</tbody></table></div>`}
function showSecret(id,secret){S.seens=S.seens||{};S.seens[id]=secret;openDlg(`<div class="dh"><h2>Client secret</h2><p><b>${esc(id)}</b> · 只显示这一次，请立即复制。Gemini 对话框和同意页都要用它。</p></div><div style="padding:12px 24px"><div class="secret"><span class="mono">${esc(secret)}</span><button class="iconbtn" data-copy="${esc(secret)}"><span class="ms">content_copy</span></button></div></div><div class="df"><button class="btn text" data-close>关闭</button><button class="btn filled" data-copy="${esc(secret)}"><span class="ms">content_copy</span>复制</button></div>`)}

/* ---------- log ---------- */
function vLog(){return `<div class="card" style="padding:0;overflow:hidden"><div style="padding:20px 22px 8px"><h3><span class="ms">monitoring</span>最近请求</h3><p class="desc">adapter 转发到上游的 JSON-RPC 调用，最近 100 条</p></div><div id="logbody" style="padding:8px 8px 8px"><div class="empty" style="padding:32px"><p>加载中…</p></div></div></div>`}
async function loadLog(){try{const rows=await api('GET','/api/log');$('#logbody').innerHTML=rows.length?`<table class="log-table"><thead><tr><th>时间</th><th>实例</th><th>方法</th><th>状态</th><th>耗时</th><th>客户端</th><th>错误</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${ago(r.t)}</td><td class="mono">${esc(r.inst)}</td><td class="mono">${esc(r.method)}</td><td><span class="chip ${r.status<300?'ok':r.status<500?'warn':'bad'}" style="height:24px">${r.status}</span></td><td class="mono">${r.ms} ms</td><td class="mono">${esc(r.client??'—')}</td><td class="err-cell" title="${esc(r.err??'')}">${esc(r.err??'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty" style="padding:40px"><p>还没有请求。Gemini 接入后会在这里看到。</p></div>'}catch(e){$('#logbody').innerHTML=`<div class="empty"><p>${esc(e.message)}</p></div>`}}

/* ---------- guide ---------- */
function vGuide(){setTitle('接入说明','三步接入 Gemini');return `
  <div class="stats"><div class="stat"><div class="n">${S.meta.instances??0}</div><div class="l"><span class="ms">dns</span>实例</div></div><div class="stat"><div class="n">${S.meta.clients??0}</div><div class="l"><span class="ms">key</span>客户端</div></div><div class="stat"><div class="n">${S.meta.allowDcr?'开启':'关闭'}</div><div class="l"><span class="ms">app_registration</span>动态注册</div></div></div>
  <div class="card" style="margin-bottom:16px"><h3><span class="ms">route</span>工作原理</h3><p class="desc" style="margin-top:8px;line-height:1.8">Gemini 只接受「无鉴权」或「标准 OAuth 2.1」两种 MCP 接入方式。adapter 对 Gemini 呈现完整的 OAuth 2.1 授权服务器（授权码 + PKCE，refresh token，RFC 8414/9728 发现），对上游则按实例配置注入鉴权（Header / Query / Bearer / OAuth2 client_credentials），JSON-RPC 原样转发。</p></div>
  <div class="card"><h3><span class="ms">checklist</span>步骤</h3>
  <ol style="line-height:2;padding-left:22px;margin:12px 0 0">
    <li><b>实例</b> → 添加上游 MCP（URL + 鉴权）→ 点「检测」确认能看到工具列表</li>
    <li><b>客户端</b> → 创建一个 client，复制 secret（只显示一次）</li>
    <li>Gemini → 设置 → Connected apps（或 <span class="mono">gemini.google.com/devmode</span>）→ <i>Connect to an MCP server</i> → 填实例卡片上「Gemini 接入」里的三项</li>
    <li>浏览器弹出同意页 → 输入同一个 client secret → 完成</li>
  </ol>
  <p class="desc" style="margin-top:14px;line-height:1.8"><b style="color:var(--on-surface)">限制：</b>上游需要「每个用户各自登录」的 MCP（Notion、GitHub 用户授权等）暂不支持——所有 Gemini 用户共用实例里配置的凭据。Logo 属于 Google Connected Console 的 Connected App 注册（512×512 PNG），不在 MCP 侧配置。</p></div>`}

/* ---------- dialog + actions ---------- */
function openDlg(h){const d=$('#dlg');d.innerHTML=h;/* every dialog body starts with .dh h2 — make it the accessible name */const h2=d.querySelector('.dh h2');if(h2){h2.id='dlg-title'}const first=d.querySelector('input:not([type=hidden]),select,textarea,button.btn.filled,button.btn.text');if(first&&!d.querySelector('[autofocus]'))first.setAttribute('autofocus','');d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());d.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const v=b.dataset.copy;copy(v)});d.showModal()}
function bind(){
  $('#content').querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
    const act=b.dataset.act;const card=b.closest('[data-name]');const name=card?.dataset.name;
    b.disabled=true;try{
      if(act==='add')openEdit();
      else if(act==='edit')openEdit(S.instances.find(i=>i.name===name));
      else if(act==='conn')openConn(name);
      else if(act==='del'){if(confirm(`删除实例 ${name}？Gemini 侧会立刻无法调用。`)){await api('DELETE',`/api/instances/${name}`);delete probes[name];await load();render();toast('已删除')}}
      else if(act==='probe'){const chip=card.querySelector('.chips');chip.querySelectorAll('.chip')[1].outerHTML='<span class="chip warn"><span class="ms" style="font-size:16px">sync</span>检测中</span>';try{const r=await api('POST',`/api/instances/${name}/probe`);probes[name]=r;r.ok?toast(`${name}：${r.tools.length} 个工具，${r.ms} ms`):toast(`${name}：${r.error||'检测失败'}`,true)}catch(e){probes[name]={ok:false,error:e.message};toast(e.message,true)}render()}
      else if(act==='addc'){const r=await api('POST','/api/clients',{id:$('#cid').value.trim(),name:$('#cname').value.trim()});await load();render();showSecret(r.id,r.secret)}
      else if(act==='rot'){const id=b.dataset.id;if(!confirm(`轮换 ${id} 的 secret？旧 secret 立即失效，Gemini 需要重新接入。`))return;const r=await api('POST',`/api/clients/${id}/rotate`);showSecret(id,r.secret)}
      else if(act==='delc'){const id=b.dataset.id;if(!confirm(`删除 client ${id}？`))return;await api('DELETE',`/api/clients/${id}`);await load();render();toast('已删除')}
    }catch(e){toast(e.message,true)}finally{b.disabled=false}
  });
}
// Theme: follow the system unless the user pinned a scheme; react to OS changes while following.
const mq=matchMedia('(prefers-color-scheme: dark)');
const applyScheme=()=>{const pin=localStorage.getItem('scheme');if(pin==='light'||pin==='dark'){document.documentElement.dataset.scheme=pin}else{delete document.documentElement.dataset.scheme}
  const dark=pin?pin==='dark':mq.matches;$('#themeicon').textContent=dark?'light_mode':'dark_mode'};
$('#themebtn').onclick=()=>{const cur=document.documentElement.dataset.scheme||(mq.matches?'dark':'light');const next=cur==='dark'?'light':'dark';localStorage.setItem('scheme',next);applyScheme()};
mq.addEventListener('change',applyScheme);applyScheme();
boot();
</script>
</body>
</html>
